name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: pytest tests/unit tests/contract tests/conformance -q

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: '3.12' }
      - run: pip install -e ".[dev]"
      # src/oblodai/generated (and contract/snapshot) must be exactly what the backend generator
      # makes of the contract. That needs the private backend, so here it says it skipped: run it
      # locally with `make ci` and OBLODAI_BACKEND. The tests below run the conformance suite and
      # the signing vectors against the vendored contract/snapshot instead.
      - run: python scripts/check_generated.py
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: '3.12' }
      - run: python -m pip install "build==1.6.1" "twine>=7,<8"
      - run: python -m build
      # A malformed long description is only discovered at upload time otherwise.
      - run: twine check dist/*
      # What ships must contain what the docs promise: the contract snapshot, the agent guide
      # and the runnable examples.
      - name: the sdist carries the contract snapshot, AGENTS.md and examples
        run: |
          set -euo pipefail
          sdist=$(ls dist/*.tar.gz)
          tar -tzf "$sdist" > /tmp/sdist.txt
          for path in contract/webhook-samples.json AGENTS.md examples/accept_payment.py; do
            grep -q "/$path$" /tmp/sdist.txt || { echo "sdist is missing $path"; exit 1; }
          done
          wheel=$(ls dist/*.whl)
          python -m zipfile -l "$wheel" | grep -q "oblodai/AGENTS.md" \
            || { echo "wheel is missing oblodai/AGENTS.md"; exit 1; }
