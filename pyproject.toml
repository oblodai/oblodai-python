[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oblodai"
version = "1.3.0"
description = "Official Python SDK for the Oblodai crypto payment gateway: invoices, payouts, payout links, static wallets, webhooks."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Oblodai" }]
keywords = [
    "oblodai",
    "crypto",
    "payments",
    "payout",
    "cryptocurrency",
    "usdt",
    "webhook",
    "payment-gateway",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
# Upper bound on purpose: httpx 1.0 may move the streaming/timeout API this SDK
# drives directly, and a silent major bump is not something a payments client survives.
dependencies = ["httpx>=0.24,<1.0"]

[project.urls]
Homepage = "https://github.com/oblodai/oblodai-python"
Repository = "https://github.com/oblodai/oblodai-python"
Documentation = "https://github.com/oblodai/oblodai-python#readme"
Issues = "https://github.com/oblodai/oblodai-python/issues"
Changelog = "https://github.com/oblodai/oblodai-python/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-asyncio>=0.23",
    "ruff==0.16.4",
    "mypy>=1.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/oblodai"]

[tool.hatch.build.targets.wheel.force-include]
# Inside the package, not at the top of site-packages: an agent reading the installed SDK finds
# it at `importlib.resources.files("oblodai") / "AGENTS.md"`.
"AGENTS.md" = "oblodai/AGENTS.md"

[tool.hatch.build.targets.sdist]
include = [
    "src/oblodai",
    "contract",
    "examples",
    "scripts",
    "tests",
    "AGENTS.md",
    "MIGRATION-1.3.md",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:oblodai.*"]

[tool.ruff]
line-length = 100
target-version = "py39"
extend-exclude = ["contract"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    # The wire vocabulary is snake_case and sometimes shadows builtins (`list`, `format`, `id`).
    "A003",
    # Generated contract modules carry long literal lines.
    "E501",
    # The English field docs the core exports use typographic dashes and quotes verbatim.
    "RUF001",
    "RUF002",
    "RUF003",
    # Python 3.9 is supported: typing.Optional/List/Dict/Tuple stay spelled that way so the
    # annotations are readable at runtime too (get_type_hints on TypedDicts).
    "UP006",
    "UP007",
    "UP035",
    "UP045",
]

[tool.ruff.lint.per-file-ignores]
"src/oblodai/contract/requests.py" = ["E501"]

[tool.mypy]
# mypy 2.x no longer accepts 3.9 here; ruff's target-version = "py39" guards the syntax.
python_version = "3.10"
strict = true
files = ["src/oblodai", "scripts", "tests"]
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_reexport = false
