# Publishes 'oblodai' to PyPI on a v* tag.
# Required repo secret: PYPI_API_TOKEN (PyPI API token).
# Alternatively configure PyPI Trusted Publishing (OIDC) and drop the password line.
name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
